sim_gps_normalizer:
  ros__parameters:
    delivery_poll_period_s: 0.01
    frame_id: gps_link
    gnss.covariance_m2: 0.0004
    gnss.degraded_covariance_m2: 1.0
    gnss.degraded_navsat_status: 0
    gnss.degraded_rtk_status: RTK_FLOAT
    gnss.degraded_vertical_noise_m: 1.5
    gnss.dropout_probability: 0.0
    gnss.forced_dropout_end_s: null
    gnss.forced_dropout_start_s: null
    gnss.jitter_s: 0.0
    gnss.latency_s: 0.3
    gnss.navsat_status: 2
    gnss.noise_stddev_m: 0.02
    gnss.quality_degraded_duration_s: 0.0
    gnss.quality_transition_period_s: 0.0
    gnss.rate_hz: 10.0
    gnss.rtk_status: RTK_FIXED
    gnss.vertical_noise_stddev_m: 0.04
    gps_profile: f9p_rtk
    input_topic: /gps/fix_raw
    max_pending: 256
    output_topic: /gps/fix
    random_seed: -1
    rtk_status_topic: /gps/rtk_status
    sim_sensor_profile: independent_nominal
    sim_sensor_seed: 6402
    use_sim_time: true
  uninitialized_parameters:
  - gnss.forced_dropout_start_s
  - gnss.forced_dropout_end_s
