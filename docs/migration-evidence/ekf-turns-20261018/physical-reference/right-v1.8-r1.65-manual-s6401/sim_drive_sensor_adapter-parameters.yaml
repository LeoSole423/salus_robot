sim_drive_sensor_adapter:
  ros__parameters:
    drive_odom_topic: /sim/sensors/drive_odom
    joint_states_topic: /joint_states
    max_pending_samples: 100
    odom_topic: /odom_raw
    release_timer_period_s: 0.001
    sim_joint_states_topic: /sim/sensors/joint_states
    sim_sensor_profile: independent_nominal
    sim_sensor_seed: 6401
    steering.bias_deg: 0.0
    steering.dropout_probability: 0.0
    steering.jitter_s: 0.0
    steering.latency_s: 0.0
    steering.noise_stddev_deg: 0.0
    use_sim_time: true
    wheel.bias_mps: 0.0
    wheel.dropout_probability: 0.0
    wheel.jitter_s: 0.0
    wheel.latency_s: 0.0
    wheel.noise_stddev_mps: 0.0
    wheel.traction_scale: 1.0
  uninitialized_parameters: []
