schema_version: 1
allowed_states:
  - pending
  - characterized
  - ported
  - parity_passed
  - hardware_validated
components:
  ci_and_migration_harness:
    source: repository_infrastructure
    target: repository_infrastructure
    state: ported
    evidence:
      - tools/validate_repository.py
      - tools/test.sh
      - tools/smoke_control_sim.sh
  control_interfaces:
    source: interfaces
    target: salus_interfaces
    state: parity_passed
    contracts:
      - CmdVelFinal
      - DriveTelemetry
      - BatteryMissionGuard
      - SetSimBatteryPreset
      - SetSimBatteryState
    evidence:
      - tools/compare_interfaces.py
  control_core:
    source: controller_server
    target: salus_control
    state: parity_passed
    evidence:
      - src/salus_control/test/test_control_logic.py
      - src/salus_control/test/test_battery_estimator.py
      - src/salus_control/test/test_sim_gazebo_backend.py
  vehicle_measurement_contracts:
    source: controller_server/rpy_esp32_comms and sensores
    target: salus_interfaces
    state: characterized
    contracts:
      - MeasurementMetadata
      - TractionMeasurement
      - SteeringMeasurement
    evidence:
      - docs/decisions/0008-hardware-measurement-boundaries.md
      - docs/migration-evidence/intent/hardware-measurements-and-odometry.md
    note: Contracts separate physical measurements from calibrated conversions, wheel odometry and fused localization. A read-only DriveTelemetry compatibility adapter is ported in salus_hardware; calibrated/direct adapters and hardware validation remain pending.
  jetson_hardware_contract_observation:
    source: ROS2_SALUS real_global_v2_wifi on Jetson
    target: salus_hardware and salus_localization profiles
    state: characterized
    contracts:
      - sensor_msgs/Imu
      - sensor_msgs/NavSatFix
      - nav_msgs/Odometry
      - DriveTelemetry
      - RTCM backend boundary
    evidence:
      - docs/migration-evidence/intent/jetson-hardware-contract-observation.md
      - tools/observe_hardware_contracts.py
    note: Passive SSH/ROS graph observation confirmed the live Pixhawk/MAVROS IMU and GNSS, RTK delivery chain, controller telemetry, derived Ackermann odometry, RS16 pipeline and EKF authorities without modifying the running legacy stack. It also found base_link sensor frames, a dual-typed /rtcm topic and stale public status aliases. salus_robot was not deployed or executed, no bag was recorded and hardware_validated remains false.
  rtk_gnss_contract_routing:
    source: ROS2_SALUS rtk_source_manager, rtk_bridge and legacy RTK status topics
    target: salus_interfaces, salus_hardware, salus_bringup and salus_web
    state: ported
    contracts:
      - RtcmFrame
      - GnssRtkStatus
    evidence:
      - docs/migration-evidence/intent/rtk-gnss-contract-routing.md
      - src/salus_interfaces/msg/RtcmFrame.msg
      - src/salus_interfaces/msg/GnssRtkStatus.msg
      - src/salus_hardware/salus_hardware/rtk_domain.py
      - src/salus_hardware/salus_hardware/legacy_rtk_observer.py
      - src/salus_hardware/salus_hardware/rtcm_dry_run_sink.py
      - src/salus_hardware/salus_hardware/pixhawk_rtk_adapter.py
      - src/salus_bringup/launch/rtk_gnss_observation.launch.py
      - src/salus_web/salus_web/ros_gateway.py
    note: The canonical RTCM and typed GNSS/RTK boundary now includes an explicit Pixhawk adapter. GPSRAW constants 5/6 map to RTK_FLOAT/RTK_FIXED; RTCM freshness never determines fix quality. MAVROS delivery requires pixhawk_mavros plus delivery_enabled=true, defaults off and creates no output publisher while off. direct_usb remains unavailable without fallback. Outdoor coexistence validated the disabled-delivery Pixhawk profile with fix_type 6, 32 satellites, fresh canonical corrections, one canonical status publisher and the legacy bridge remaining the sole MAVROS RTCM publisher. Actual delivery validation remains pending and must not run alongside that bridge. No NTRIP, MAVROS/FCU process, UART, TF, movement or actuator path is started.
  pixhawk_sensor_inputs:
    source: MAVROS /imu/data and /global_position/raw/fix
    target: salus_hardware adapter and explicit salus_localization selectors
    state: hardware_validated
    contracts:
      - /hardware/imu_primary/data
      - /hardware/gnss_primary/fix
      - /salus/imu/data
      - /salus/gps/fix
    evidence:
      - docs/migration-evidence/intent/pixhawk-sensor-input-adapter.md
      - src/salus_hardware/test/test_pixhawk_sensor_domain.py
      - src/salus_localization/test/test_gnss_selection_policy.py
      - src/salus_bringup/test/test_pixhawk_sensor_inputs_launch.py
    note: Read-only Pixhawk/MAVROS adapter preserves the observed base_link frame, timestamps, covariance and honest NO_FIX state. Explicit selectors never fall back. A bounded Jetson run beside ROS2_SALUS confirmed one publisher per namespaced output, approximately 10 Hz IMU and 2 Hz GNSS, preserved frame/status and clean shutdown. This hardware validation covers only sensor inputs; real bringup, localization and actuation remain unvalidated.
  capability_profiles:
    source: declared robot composition
    target: salus_interfaces/SystemCapabilities and salus_bringup
    state: ported
    contracts:
      - CapabilityState
      - SystemCapabilities
    evidence:
      - src/salus_hardware/salus_hardware/capability_profile.py
      - src/salus_navigation/launch/safety_arbitration_no_obstacles_sim.launch.py
      - tools/smoke_navigation_no_obstacles_sim.sh
      - docs/decisions/0009-explicit-obstacle-detection-capability.md
      - docs/migration-evidence/intent/no-obstacle-detection-profile.md
    note: Simulation explicitly selects obstacle_detection (default) or no_obstacle_detection. The degraded profile publishes no fictitious scan, preserves one /cmd_vel_safe authority, keepout, PathHealth, command arbitration, watchdogs and braking. ENABLED_BY_PROFILE is not runtime health; no automatic fallback or hardware validation exists.
  vehicle_command_contract:
    source: CmdVelFinal and controller_server actuation state
    target: salus_interfaces/VehicleCommand
    state: characterized
    contracts:
      - VehicleCommand
    evidence:
      - src/salus_interfaces/msg/VehicleCommand.msg
      - docs/decisions/0008-hardware-measurement-boundaries.md
      - docs/migration-evidence/intent/vehicle-command-contract.md
    note: Backend-independent atomic Ackermann command with explicit validity, enable, E-stop and normalized service brake. CmdVelFinal remains authoritative upstream; the translated shadow can now drive the selectable simulation-only canonical backend, with no UART or hardware path enabled.
  legacy_vehicle_command_shadow:
    source: salus_control/CmdVelFinal
    target: salus_control/legacy_vehicle_command_adapter
    state: ported
    contracts:
      - CmdVelFinal
      - VehicleCommand
    evidence:
      - src/salus_control/salus_control/legacy_vehicle_command.py
      - src/salus_control/test/test_legacy_vehicle_command.py
      - tools/smoke_control_sim.py
      - docs/migration-evidence/intent/legacy-vehicle-command-shadow.md
    note: Translation path from the authoritative legacy command to /vehicle/command_shadow. It remains observational by default and becomes a Gazebo input only in the explicit canonical simulation profile; it cannot actuate UART or hardware.
  vehicle_command_shadow_comparison:
    source: /cmd_vel_final and /vehicle/command_shadow
    target: /vehicle/command_shadow/diagnostics
    state: ported
    contracts:
      - CmdVelFinal
      - VehicleCommand
      - DiagnosticArray
    evidence:
      - src/salus_control/salus_control/vehicle_command_comparison.py
      - src/salus_control/test/test_vehicle_command_comparison.py
      - tools/smoke_control_sim.py
      - docs/migration-evidence/intent/vehicle-command-shadow-comparison.md
    note: Non-authoritative simulation observer with FIFO pairing, monotonic timeout, bounded queues and latched mismatch counters. It publishes diagnostics only and cannot modify or block control.
  canonical_command_dry_run:
    source: /vehicle/command_shadow
    target: salus_control/canonical_command_dry_run
    state: ported
    contracts:
      - VehicleCommand
      - DiagnosticArray
    evidence:
      - src/salus_control/salus_control/canonical_command_consumer.py
      - src/salus_control/test/test_canonical_command_consumer.py
      - tools/smoke_control_sim.py
      - docs/migration-evidence/intent/canonical-command-consumer-dry-run.md
    note: Non-authoritative canonical validation and monotonic watchdog with diagnostics-only dry-run output. It is not connected to Gazebo, UART, Pixhawk or hardware.
  canonical_command_sim_backend:
    source: /vehicle/command_shadow
    target: salus_control/controller_server with sim_gazebo
    state: ported
    contracts:
      - VehicleCommand
      - geometry_msgs/Twist
    evidence:
      - src/salus_control/salus_control/canonical_command_consumer.py
      - src/salus_control/salus_control/controller_server_node.py
      - tools/smoke_control_sim.py
      - tools/smoke_navigation_canonical_sim.sh
      - docs/migration-evidence/intent/canonical-command-sim-backend.md
      - docs/migration-evidence/intent/canonical-navigation-motion.md
    note: Selectable simulation-only canonical authority reuses the single Gazebo backend, with legacy input remaining the default. A complete Nav2 goal is validated through the sole nav_command_server authority, the transitional VehicleCommand adapter and fresh canonical consumption. Canonical input is explicitly rejected with UART; acceleration, jerk and steering-rate constraints are not implemented by the current simulation plugin.
  legacy_drive_measurement_adapter:
    source: controller_server/DriveTelemetry
    target: salus_hardware/legacy_drive_measurement_node
    state: ported
    contracts:
      - DriveTelemetry
      - TractionMeasurement
      - SteeringMeasurement
    evidence:
      - src/salus_hardware/salus_hardware/legacy_drive_measurement_domain.py
      - src/salus_hardware/test/test_legacy_drive_measurement_domain.py
    note: Read-only compatibility adapter. Hall data is represented as motor-shaft traction; AS5600 data as steering linkage. No real launch or hardware validation is included.
  vehicle_kinematic_conversion:
    source: physical vehicle measurements
    target: salus_hardware/vehicle_kinematic_converter
    state: ported
    contracts:
      - TractionMeasurement
      - SteeringMeasurement
    evidence:
      - src/salus_hardware/salus_hardware/kinematic_conversion_domain.py
      - src/salus_hardware/test/test_kinematic_conversion_domain.py
      - docs/migration-evidence/intent/hardware-measurements-and-odometry.md
    note: Pure calibrated conversion plus a read-only ROS adapter. Calibration is disabled by default; no odometry, source fusion, real launch or hardware validation is included.
  controller_uart:
    source: controller_server/rpy_esp32_comms
    target: salus_control/rpy_esp32_comms
    state: ported
    evidence:
      - src/salus_control/test/test_uart_controller.py
      - src/salus_control/test/test_uart_protocol.py
    note: Preserved and unit-tested, but not connected to hardware in this phase.
  robot_description:
    source: navegacion_gps/models
    target: salus_description
    state: ported
    evidence:
      - src/salus_description/urdf/salus_robot.urdf.xacro
      - src/salus_description/test/test_description.py
      - docs/migration-evidence/motion-ackermann.md
    note: Physical dimensions originate in cuatri_real_v2 and remain unvalidated on hardware.
  simulation:
    source: navegacion_gps/worlds
    target: salus_simulation
    state: ported
    evidence:
      - src/salus_simulation/launch/motion_sim.launch.py
      - tools/smoke_motion_sim.sh
    note: Ackermann motion plus reduced GPS/LiDAR simulation are ported. Legacy A/B characterization remains pending.
  localization:
    source: navegacion_gps
    target: salus_localization
    state: ported
    evidence:
      - src/salus_localization/launch/localization_sim.launch.py
      - src/salus_localization/test/test_ackermann_odometry.py
      - src/salus_localization/test/test_kinematic_ackermann_odometry_domain.py
      - src/salus_localization/test/test_kinematic_ackermann_odometry_node.py
      - src/salus_bringup/launch/vehicle_io_sim.launch.py
      - tools/smoke_localization_sim.sh
      - tools/smoke_sensor_selection_sim.sh
      - docs/migration-evidence/intent/imu-and-global-orientation-profiles.md
    note: Local and global simulation localization are ported, including deterministic GPS profiles, fixed datum, /fromLL, map-to-odom EKF, RTK/course-heading gates and stationary gates. Simulation explicitly selects one local IMU and one global orientation source without fallback; only imu_primary is produced, while external_heading uses a ground-truth fixture. The global EKF and navsat_transform share the selected heading, and stationary local yaw is diagnostic rather than a second absolute source. Simulation can select legacy or canonical vehicle odometry while preserving one main authority. Physical mounts, Pixhawk/PCB adapters, dual-GNSS semantics, real-bag parity and calibration remain pending.
  lidar_perception:
    source: navegacion_gps
    target: salus_perception
    state: ported
    evidence:
      - src/salus_perception/launch/lidar_sim.launch.py
      - src/salus_perception/test/test_scan_filters.py
      - tools/replay_lidar_report.py
      - tools/smoke_lidar_sim.py
    note: Reduced 8-channel Gazebo model and 3D local pipeline are ported. The raw Gazebo frame is normalized at /scan_3d; RS16 bag replay and RViz inspection are required for parity.
  navigation:
    source: navegacion_gps
    target: salus_navigation
    state: ported
    evidence:
      - src/salus_navigation/salus_navigation/nav_command_server.py
      - src/salus_navigation/launch/safety_arbitration_sim.launch.py
      - tools/smoke_safety_sim.py
      - tools/smoke_patrol_battery_sim.py
      - docs/decisions/0003-latched-battery-return-home.md
      - src/salus_navigation/salus_navigation/nav_snapshot_server.py
      - tools/smoke_navigation_snapshot.sh
      - docs/migration-evidence/intent/rviz-goal-control.md
      - docs/migration-evidence/intent/2026-08-30-vector-keepout-costmap-layer.md
    note: Safety arbitration, a single Nav2 LL goal, guarded RViz map goals, dynamic GeoJSON keepout, stable path-health replanning, checkpoint-correct routes, controlled recovery, causal lifecycle startup, waypoint actions and transactional urban/rural profiles are ported in simulation. Keepouts now use the bounded vector layer in rolling global/local costmaps; fixed PGM/LoadMap/KeepoutFilter runtime and full-mask DDS are removed. Snapshot and goal rejection consume projected vector state directly. Deterministic long-range simulation and hardware evidence remain pending. Structured patrol/HOME has atomic LL conversion/persistence and a latched manual/battery return validated in simulation without duplicating Nav2 or velocity ownership. Snapshots are ported as a separate ROS capture, pure renderer and PNG service; Cockpit integration remains pending. Legacy A/B and hardware parity remain pending.
  navigation_bt:
    source: navegacion_gps_bt
    target: salus_navigation_bt
    state: ported
    evidence:
      - docs/decisions/0002-nav2-hardening-and-legacy-bt.md
      - src/salus_navigation_bt/src/path_health_condition.cpp
      - src/salus_navigation/salus_navigation/path_health.py
      - docs/migration-evidence/intent/navigation-path-health.md
    note: La política útil de path estable y despeje se migró como PathHealth; TraceReplan queda diferido hasta justificar NavigateThroughPoses.
  operator_web:
    source: map_tools
    target: salus_web
    state: ported
    evidence:
      - docs/migration-evidence/intent/web-cockpit-bridge.md
      - docs/migration-evidence/intent/web-robot-pose-heading.md
      - src/salus_web/test/fixtures/cockpit_protocol/scenarios.json
      - src/salus_web/salus_web/protocol.py
      - src/salus_web/salus_web/operator_guard.py
      - src/salus_web/salus_web/operator_lease.py
      - src/salus_web/salus_web/state_projection.py
      - src/salus_web/salus_web/waypoint_repository.py
      - src/salus_web/salus_web/ros_gateway.py
      - src/salus_web/salus_web/websocket_server.py
      - src/salus_web/test/test_compact_telemetry.py
      - src/salus_web/launch/web_bridge.launch.py
      - docs/decisions/0005-web-operator-control-lease.md
      - tools/smoke_web_cockpit.sh
    note: El protocolo y el runtime ROS/WebSocket compatible con Cockpit están portados y validados en simulación con lease exclusivo, lock/heartbeat, estado, zonas, navegación/misiones, manual, persistencia y snapshot. Sesiones, rosbag, selección RTK, cámara y validación contra el Cockpit externo siguen pendientes.
  compact_remote_telemetry:
    source: navegacion_gps/scan_wifi_debug and wifi launch variants
    target: salus_perception and salus_web
    state: ported
    evidence:
      - docs/migration-evidence/intent/compact-telemetry-scan-preview.md
      - src/salus_web/test/fixtures/cockpit_protocol/compact_telemetry.json
      - src/salus_web/test/test_compact_telemetry_specification.py
      - src/salus_perception/salus_perception/scan_preview.py
      - src/salus_web/salus_web/compact_telemetry.py
      - tools/smoke_lidar_sim.py
    note: Compact/full runtime and diagnostic /scan_preview are ported and smoke-tested in simulation. The Cockpit mini-radar and RS16 replay parity remain pending.
  hardware_adapters:
    source: sensores
    target: salus_hardware
    state: ported
    evidence:
      - docs/migration-evidence/intent/camera-ptz-presets.md
      - docs/decisions/0006-camera-ptz-control-boundaries.md
      - src/salus_hardware/salus_hardware/camera_node.py
      - src/salus_hardware/test/test_camera_domain.py
      - tools/smoke_web_cockpit.py
    note: Camera PTZ, presets, ISAPI boundary, simulated backend, atomic persistence and Cockpit lease policy pass unit, WebSocket and visual simulation validation. GNSS/MAVROS, RS16, UART and physical camera validation remain pending.
  system_bringup:
    source: navegacion_gps/launch
    target: salus_bringup
    state: ported
    evidence:
      - src/salus_bringup/launch/integration_sim.launch.py
      - src/salus_bringup/launch/sim_operational.launch.py
      - docs/migration-evidence/intent/canonical-command-motion-composition.md
      - docs/migration-evidence/intent/sim-operational-bringup.md
      - tools/smoke_integration_sim.sh
      - tools/smoke_sim_operational.sh
      - tools/smoke_operational_persistence.sh
    note: El checkpoint integrado se conserva, propaga selectores independientes para medición/odometría y entrada de comandos, y sim_operational pasó una sesión end-to-end y una restauración de runtime en simulación. El movimiento canónico está validado sin navegación; falta una meta Nav2 operacional canónica, paridad legacy A/B y bringups reales. No declarar paridad de hardware.
