schema_version: 1
allowed_states:
  - pending
  - characterized
  - ported
  - parity_passed
  - hardware_validated
components:
  ci_and_migration_harness:
    source: repository_infrastructure
    target: repository_infrastructure
    state: ported
    evidence:
      - tools/validate_repository.py
      - tools/test.sh
      - tools/smoke_control_sim.sh
  real_runtime_image:
    source: Dockerfile.real and tools/build_real_image.sh
    target: salus_robot physical ARM64 runtime image
    state: hardware_validated
    evidence:
      - Dockerfile.real
      - tools/build_real_image.sh
      - src/salus_hardware/test/test_real_image_recipe.py
      - docs/migration-evidence/intent/real-runtime-image-arm64-validation-2026-09-03.md
    note: >-
      A dedicated physical image recipe keeps the development Dockerfile and
      compose simulation flow unchanged. It contains the ROS hardware/runtime
      dependencies, MAVROS GeographicLib datasets, Nav2 and CycloneDDS, while
      omitting simulation transport/rendering packages. It does not copy the
      workspace or start hardware; x86 and native Jetson ARM64 build evidence
      was built successfully on x86 and natively on the Jetson ARM64 host;
      the clean workspace build also passed inside the ARM64 image. No
      hardware launch or persistent deployment was started.
  control_interfaces:
    source: interfaces
    target: salus_interfaces
    state: parity_passed
    contracts:
      - CmdVelFinal
      - DriveTelemetry
      - BatteryMissionGuard
      - SetSimBatteryPreset
      - SetSimBatteryState
    evidence:
      - tools/compare_interfaces.py
  legacy_wire_type_compatibility:
    source: ROS2_SALUS@f35834989b041f51dd325c626d2338e2232d9e53
    target: interfaces temporary package
    state: hardware_validated
    contracts:
      - interfaces/msg/CmdVelFinal
      - interfaces/msg/DriveTelemetry
    evidence:
      - src/interfaces/README.md
      - src/interfaces/test/test_legacy_wire_contract.py
      - docs/migration-evidence/intent/legacy-wire-type-compatibility.md
      - docs/migration-evidence/intent/legacy-wire-hardware-revalidation-2026-09-02.md
    note: >-
      The package name is part of ROS 2 wire type identity. This deliberately
      minimal package preserves only the two observed legacy input identities
      for read-only coexistence adapters; it is not canonical, adds no
      authority and must be removed when ROS2_SALUS retires. Only
      salus_hardware and salus_control may depend on it. Their explicit
      input_wire_type selector defaults to salus_interfaces for simulation;
      real_observation fixes interfaces with no fallback. Salus built these
      two types itself on the Jetson (source mounted read-only, no legacy
      workspace sourced or mounted) and the stationary revalidation at 436b1ef
      against ROS2_SALUS@f358349 confirmed the real legacy wire identities now
      reach the adapters, producing canonical TractionMeasurement and
      SteeringMeasurement at about 10 Hz and an all-matched VehicleCommand
      shadow (compared=8165, matched=8165, diverged=0, authoritative=false)
      from natural legacy traffic only. That validation covers exactly these
      two read-only boundaries; a separate SIGINT double-shutdown defect in
      the three adapters was recorded but intentionally left out of this
      change.
  control_core:
    source: controller_server
    target: salus_control
    state: parity_passed
    evidence:
      - src/salus_control/test/test_control_logic.py
      - src/salus_control/test/test_battery_estimator.py
      - src/salus_control/test/test_sim_gazebo_backend.py
      - docs/migration-evidence/intent/mvp-48v-battery-and-uart-profile.md
    note: >-
      The controller uses the calibrated 48 V ESP32 sample directly: no
      lead-acid EMA remains. Its operator curve is 44.5/0%, 46.5/15%,
      48.0/35%, 50.0/60%, 52.0/85% and 53.5/100%; the typed mission guard
      latches at <=46.5 V for 30 s and clears at >=48.0 V for 30 s. Patrol
      already gives a valid typed BatteryMissionGuard precedence over the SOC
      fallback, so the approximate percentage does not drive a mission after a
      valid guard is observed.
  vehicle_measurement_contracts:
    source: controller_server/rpy_esp32_comms and sensores
    target: salus_interfaces
    state: characterized
    contracts:
      - MeasurementMetadata
      - TractionMeasurement
      - SteeringMeasurement
    evidence:
      - docs/decisions/0008-hardware-measurement-boundaries.md
      - docs/migration-evidence/intent/hardware-measurements-and-odometry.md
    note: Contracts separate physical measurements from calibrated conversions, wheel odometry and fused localization. A read-only DriveTelemetry compatibility adapter is ported in salus_hardware; calibrated/direct adapters and hardware validation remain pending.
  jetson_hardware_contract_observation:
    source: ROS2_SALUS real_global_v2_wifi on Jetson
    target: salus_hardware and salus_localization profiles
    state: characterized
    contracts:
      - sensor_msgs/Imu
      - sensor_msgs/NavSatFix
      - nav_msgs/Odometry
      - DriveTelemetry
      - RTCM backend boundary
    evidence:
      - docs/migration-evidence/intent/jetson-hardware-contract-observation.md
      - docs/migration-evidence/intent/jetson-deployment-read-only-refresh-2026-09-02.md
      - tools/observe_hardware_contracts.py
    note: Passive SSH/ROS graph observation on 27–28/08 confirmed the live Pixhawk/MAVROS IMU and GNSS, RTK delivery chain, controller telemetry, derived Ackermann odometry, RS16 pipeline and EKF authorities without modifying the running legacy stack. The 02/09 refresh confirmed the clean legacy checkout, active systemd/Docker launch, environment, graph counts and preservable local assets; Pixhawk/GNSS and LiDAR were intentionally disconnected, so no new physical signal validation was claimed. salus_robot was not deployed or executed, no bag was recorded and hardware_validated remains false.
  rtk_gnss_contract_routing:
    source: ROS2_SALUS rtk_source_manager, rtk_bridge and legacy RTK status topics
    target: salus_interfaces, salus_hardware, salus_bringup and salus_web
    state: ported
    contracts:
      - RtcmFrame
      - GnssRtkStatus
    evidence:
      - docs/migration-evidence/intent/rtk-gnss-contract-routing.md
      - src/salus_interfaces/msg/RtcmFrame.msg
      - src/salus_interfaces/msg/GnssRtkStatus.msg
      - src/salus_hardware/salus_hardware/rtk_domain.py
      - src/salus_hardware/salus_hardware/ntrip_protocol.py
      - src/salus_hardware/salus_hardware/ntrip_source_config.py
      - src/salus_hardware/salus_hardware/ntrip_rtcm_source.py
      - src/salus_hardware/salus_hardware/legacy_rtk_observer.py
      - src/salus_hardware/salus_hardware/rtcm_dry_run_sink.py
      - src/salus_hardware/salus_hardware/pixhawk_rtk_adapter.py
      - src/salus_bringup/launch/rtk_gnss_observation.launch.py
      - src/salus_web/salus_web/ros_gateway.py
    note: The canonical RTCM and typed GNSS/RTK boundary now includes explicit NTRIP acquisition and a Pixhawk adapter. The NTRIP source validates HTTP/ICY/chunked and RTCM CRC24Q, reads private config read-only, and publishes acquisition-only GnssRtkStatus without inferring receiver fix quality. GPSRAW constants 5/6 map to RTK_FLOAT/RTK_FIXED; RTCM freshness never determines fix quality. MAVROS delivery requires pixhawk_mavros plus delivery_enabled=true, defaults off and creates no output publisher while off. direct_usb remains unavailable without fallback. Outdoor coexistence previously validated the disabled-delivery Pixhawk profile with fix_type 6, 32 satellites, fresh canonical corrections, one canonical status publisher and the legacy bridge remaining the sole MAVROS RTCM publisher. NTRIP acquisition is validated only with a local fake caster; actual caster/Pixhawk delivery, UART, TF, movement and actuator validation remain pending and must not run alongside the legacy bridge.
  pixhawk_sensor_inputs:
    source: MAVROS /imu/data and /global_position/raw/fix
    target: salus_hardware adapter and explicit salus_localization selectors
    state: hardware_validated
    contracts:
      - /hardware/imu_primary/data
      - /hardware/gnss_primary/fix
      - /salus/imu/data
      - /salus/gps/fix
    evidence:
      - docs/migration-evidence/intent/pixhawk-sensor-input-adapter.md
      - src/salus_hardware/test/test_pixhawk_sensor_domain.py
      - src/salus_localization/test/test_gnss_selection_policy.py
      - src/salus_bringup/test/test_pixhawk_sensor_inputs_launch.py
    note: Read-only Pixhawk/MAVROS adapter preserves the observed base_link frame, timestamps, covariance and honest NO_FIX state. Explicit selectors never fall back. A bounded Jetson run beside ROS2_SALUS confirmed one publisher per namespaced output, approximately 10 Hz IMU and 2 Hz GNSS, preserved frame/status and clean shutdown. This hardware validation covers only sensor inputs; real bringup, localization and actuation remain unvalidated.
  pixhawk_mavros_real_owner:
    source: ROS2_SALUS@f35834989b041f51dd325c626d2338e2232d9e53 sensores/mavros.launch.py
    target: salus_hardware/pixhawk_real.launch.py
    state: hardware_validated
    contracts:
      - /imu/data
      - /global_position/raw/fix
      - /local_position/velocity_local
      - /local_position/odom
      - mavros_msgs/GPSRAW
    evidence:
      - src/salus_hardware/config/mavros_sensor_only_pluginlists.yaml
      - src/salus_hardware/config/mavros_apm_overrides.yaml
      - src/salus_hardware/launch/pixhawk_real.launch.py
      - src/salus_hardware/test/test_mavros_real_config.py
      - src/salus_hardware/test/test_pixhawk_real_launch.py
      - docs/migration-evidence/intent/mavros-real-owner.md
      - docs/migration-evidence/intent/mavros-real-owner-hardware-validation-2026-09-03.md
    note: >-
      The sensor-only owner was validated stationary on hardware from
      salus_robot main@c3829dd against ROS2_SALUS@f358349. MAVROS connected to
      the Pixhawk at /dev/ttyACM0:921600; IMU was about 10 Hz and GNSS/GPSRAW
      about 2 Hz with fresh samples. MAVROS emitted no TF payloads and opened
      no ESP32 UART; RTCM delivery had zero publishers. The configured
      imu_link/gps_link frames were observed as base_link and GPSRAW /wgs84,
      and GPSRAW appeared under /mavros_node/mavros_node/gps1/raw; these are
      recorded compatibility observations, not silently corrected here. SIGINT
      shutdown was clean and the legacy service regained the FCU exclusively.
      NTRIP, RS16, UART/control, localization, Nav2 and full cutover remain
      unvalidated.
  real_observation_bringup:
    source: ROS2_SALUS topics during coexistence
    target: salus_bringup real_observation.launch.py
    state: ported
    contracts:
      - /hardware/imu_primary/data
      - /hardware/gnss_primary/fix
      - RtcmFrame
      - GnssRtkStatus
      - TractionMeasurement
      - SteeringMeasurement
      - VehicleCommand
      - DiagnosticArray
    evidence:
      - src/salus_bringup/launch/real_observation.launch.py
      - src/salus_bringup/test/test_real_observation_launch.py
      - docs/migration-evidence/intent/jetson-hardware-contract-observation.md
      - docs/migration-evidence/intent/jetson-deployment-read-only-refresh-2026-09-02.md
      - docs/migration-evidence/intent/real-observation-hardware-validation-2026-09-02.md
      - docs/migration-evidence/intent/legacy-wire-hardware-revalidation-2026-09-02.md
    note: >-
      Coexistence-only composition. The 2026-09-02 stationary Jetson validation confirmed read-only IMU/GNSS adaptation, disabled-delivery RTCM dry-run, no new TF/RTCM/UART authority and intact legacy RS16/TF/service after rollback. It initially found that installed legacy `interfaces/msg/DriveTelemetry` and `interfaces/msg/CmdVelFinal` cannot interoperate with the same-shaped `salus_interfaces` types; the temporary `interfaces` package plus the explicit `input_wire_type` selector closed that gap, and a follow-up stationary revalidation confirmed both boundaries end to end on the robot with natural legacy traffic and no injected command. It does not start UART, MAVROS, NTRIP, RS16, TF, localization, Nav2, safety, Web or camera; the wrapper fixes RTCM delivery disabled and exposes no argument to enable it. Hardware validation remains partial and read-only: localization, MAVROS, NTRIP, RS16, Nav2, UART and physical control are not hardware-validated by this profile.
  capability_profiles:
    source: declared robot composition
    target: salus_interfaces/SystemCapabilities and salus_bringup
    state: ported
    contracts:
      - CapabilityState
      - SystemCapabilities
    evidence:
      - src/salus_hardware/salus_hardware/capability_profile.py
      - src/salus_navigation/launch/safety_arbitration_no_obstacles_sim.launch.py
      - tools/smoke_navigation_no_obstacles_sim.sh
      - docs/decisions/0009-explicit-obstacle-detection-capability.md
      - docs/migration-evidence/intent/no-obstacle-detection-profile.md
    note: Simulation explicitly selects obstacle_detection (default) or no_obstacle_detection. The degraded profile publishes no fictitious scan, preserves one /cmd_vel_safe authority, keepout, PathHealth, command arbitration, watchdogs and braking. ENABLED_BY_PROFILE is not runtime health; no automatic fallback or hardware validation exists.
  vehicle_command_contract:
    source: CmdVelFinal and controller_server actuation state
    target: salus_interfaces/VehicleCommand
    state: characterized
    contracts:
      - VehicleCommand
    evidence:
      - src/salus_interfaces/msg/VehicleCommand.msg
      - docs/decisions/0008-hardware-measurement-boundaries.md
      - docs/migration-evidence/intent/vehicle-command-contract.md
    note: Backend-independent atomic Ackermann command with explicit validity, enable, E-stop and normalized service brake. CmdVelFinal remains authoritative upstream; the translated shadow can now drive the selectable simulation-only canonical backend, with no UART or hardware path enabled.
  legacy_vehicle_command_shadow:
    source: salus_control/CmdVelFinal
    target: salus_control/legacy_vehicle_command_adapter
    state: ported
    contracts:
      - CmdVelFinal
      - VehicleCommand
    evidence:
      - src/salus_control/salus_control/legacy_vehicle_command.py
      - src/salus_control/test/test_legacy_vehicle_command.py
      - tools/smoke_control_sim.py
      - docs/migration-evidence/intent/legacy-vehicle-command-shadow.md
    note: Translation path from the authoritative legacy command to /vehicle/command_shadow. It remains observational by default and becomes a Gazebo input only in the explicit canonical simulation profile; it cannot actuate UART or hardware.
  vehicle_command_shadow_comparison:
    source: /cmd_vel_final and /vehicle/command_shadow
    target: /vehicle/command_shadow/diagnostics
    state: ported
    contracts:
      - CmdVelFinal
      - VehicleCommand
      - DiagnosticArray
    evidence:
      - src/salus_control/salus_control/vehicle_command_comparison.py
      - src/salus_control/test/test_vehicle_command_comparison.py
      - tools/smoke_control_sim.py
      - docs/migration-evidence/intent/vehicle-command-shadow-comparison.md
    note: Non-authoritative simulation observer with FIFO pairing, monotonic timeout, bounded queues and latched mismatch counters. It publishes diagnostics only and cannot modify or block control.
  canonical_command_dry_run:
    source: /vehicle/command_shadow
    target: salus_control/canonical_command_dry_run
    state: ported
    contracts:
      - VehicleCommand
      - DiagnosticArray
    evidence:
      - src/salus_control/salus_control/canonical_command_consumer.py
      - src/salus_control/test/test_canonical_command_consumer.py
      - tools/smoke_control_sim.py
      - docs/migration-evidence/intent/canonical-command-consumer-dry-run.md
    note: Non-authoritative canonical validation and monotonic watchdog with diagnostics-only dry-run output. It is not connected to Gazebo, UART, Pixhawk or hardware.
  canonical_command_sim_backend:
    source: /vehicle/command_shadow
    target: salus_control/controller_server with sim_gazebo
    state: ported
    contracts:
      - VehicleCommand
      - geometry_msgs/Twist
    evidence:
      - src/salus_control/salus_control/canonical_command_consumer.py
      - src/salus_control/salus_control/controller_server_node.py
      - tools/smoke_control_sim.py
      - tools/smoke_navigation_canonical_sim.sh
      - docs/migration-evidence/intent/canonical-command-sim-backend.md
      - docs/migration-evidence/intent/canonical-navigation-motion.md
    note: Selectable simulation-only canonical authority reuses the single Gazebo backend, with legacy input remaining the default. A complete Nav2 goal is validated through the sole nav_command_server authority, the transitional VehicleCommand adapter and fresh canonical consumption. Canonical input is explicitly rejected with UART; acceleration, jerk and steering-rate constraints are not implemented by the current simulation plugin.
  legacy_drive_measurement_adapter:
    source: controller_server/DriveTelemetry
    target: salus_hardware/legacy_drive_measurement_node
    state: ported
    contracts:
      - DriveTelemetry
      - TractionMeasurement
      - SteeringMeasurement
    evidence:
      - src/salus_hardware/salus_hardware/legacy_drive_measurement_domain.py
      - src/salus_hardware/test/test_legacy_drive_measurement_domain.py
    note: Read-only compatibility adapter. Hall data is represented as motor-shaft traction; AS5600 data as steering linkage. No real launch or hardware validation is included.
  vehicle_kinematic_conversion:
    source: physical vehicle measurements
    target: salus_hardware/vehicle_kinematic_converter
    state: ported
    contracts:
      - TractionMeasurement
      - SteeringMeasurement
    evidence:
      - src/salus_hardware/salus_hardware/kinematic_conversion_domain.py
      - src/salus_hardware/test/test_kinematic_conversion_domain.py
      - docs/migration-evidence/intent/hardware-measurements-and-odometry.md
    note: Pure calibrated conversion plus a read-only ROS adapter. Calibration is disabled by default; no odometry, source fusion, real launch or hardware validation is included.
  controller_uart:
    source: controller_server/rpy_esp32_comms
    target: salus_control/rpy_esp32_comms
    state: ported
    evidence:
      - src/salus_control/test/test_uart_controller.py
      - src/salus_control/test/test_uart_protocol.py
    note: >-
      The explicit control_real_uart.launch.py profile owns exactly one UART
      controller and uses the legacy_cmd_vel authority at 115200 baud / 50 Hz.
      It is structurally tested and deliberately excluded from read-only
      profiles; physical cutover and hardware validation remain pending.
  robot_description:
    source: navegacion_gps/models
    target: salus_description
    state: ported
    evidence:
      - src/salus_description/urdf/salus_robot.urdf.xacro
      - src/salus_description/test/test_description.py
      - docs/migration-evidence/motion-ackermann.md
    note: Physical dimensions originate in cuatri_real_v2 and remain unvalidated on hardware.
  simulation:
    source: navegacion_gps/worlds
    target: salus_simulation
    state: ported
    evidence:
      - src/salus_simulation/launch/motion_sim.launch.py
      - tools/smoke_motion_sim.sh
    note: Ackermann motion plus reduced GPS/LiDAR simulation are ported. Legacy A/B characterization remains pending.
  localization:
    source: navegacion_gps
    target: salus_localization
    state: ported
    evidence:
      - src/salus_localization/launch/localization_sim.launch.py
      - src/salus_localization/test/test_ackermann_odometry.py
      - src/salus_localization/test/test_kinematic_ackermann_odometry_domain.py
      - src/salus_localization/test/test_kinematic_ackermann_odometry_node.py
      - src/salus_bringup/launch/vehicle_io_sim.launch.py
      - tools/smoke_localization_sim.sh
      - tools/smoke_sensor_selection_sim.sh
      - docs/migration-evidence/intent/imu-and-global-orientation-profiles.md
    note: Local and global simulation localization are ported, including deterministic GPS profiles, fixed datum, /fromLL, map-to-odom EKF, RTK/course-heading gates and stationary gates. Simulation explicitly selects one local IMU and one global orientation source without fallback; only imu_primary is produced, while external_heading uses a ground-truth fixture. The global EKF and navsat_transform share the selected heading, and stationary local yaw is diagnostic rather than a second absolute source. Simulation can select legacy or canonical vehicle odometry while preserving one main authority. Physical mounts, Pixhawk/PCB adapters, dual-GNSS semantics, real-bag parity and calibration remain pending.
  physical_local_localization_shadow:
    source: ROS2_SALUS /wheel/odometry plus logical /salus/imu/data
    target: salus_localization real shadow local EKF and salus_bringup wrapper
    state: hardware_validated
    contracts:
      - /wheel/odometry
      - /salus/imu/data
      - /salus/localization_shadow/odometry/local
      - /salus/localization_shadow/diagnostics
    evidence:
      - src/salus_localization/config/localization_local_real_shadow.yaml
      - src/salus_localization/launch/localization_real_shadow.launch.py
      - src/salus_bringup/launch/real_localization_shadow.launch.py
      - src/salus_localization/test/test_localization_real_shadow_assets.py
      - src/salus_localization/test/test_localization_real_shadow_runtime.py
      - src/salus_bringup/test/test_real_localization_shadow_launch.py
      - tools/observe_localization_shadow.py
      - docs/migration-evidence/intent/physical-local-localization-shadow.md
      - docs/migration-evidence/intent/physical-local-localization-shadow-hardware-2026-09-02.md
    note: >-
      First physical local EKF, shadow-only. One robot_localization ekf_node
      named salus_local_ekf_shadow consumes the legacy wheel odometry and the
      logical Salus IMU, and publishes only
      /salus/localization_shadow/odometry/local with publish_tf, use_control
      and publish_acceleration pinned false in both the parameters file and
      explicit node overrides; no launch argument can restore authority.
      ROS2_SALUS keeps /odometry/local, odom->base_footprint, all TF, hardware
      and control. The estimator model is inherited unchanged from the
      simulated local profile because canonical physical odometry still awaits
      mechanical calibration, which deliberately separates the estimator
      problem from the calibration problem. A live ROS test starts the real
      ekf_node and asserts continuous finite output, odom/base_footprint
      frames, monotonic timestamps, an empty /tf payload and no publisher on
      /odometry/local; robot_localization still advertises a /tf endpoint even
      with publish_tf=false, so the guarantee is enforced at payload level.
      Global localization, navsat_transform, external heading, map->odom, TF
      transfer and canonical physical odometry are out of scope. A stationary
      Jetson run beside the live ROS2_SALUS stack validated the shadow only:
      620 messages in 60 s with odom/base_footprint frames, monotonic stamps
      and no non-finite values, /odometry/local keeping its single legacy
      publisher in all three windows, /tf authority confirmed by payload rather
      than by the graph (same two pairs, and odom->base_footprint counting one
      for one with the legacy EKF output, so the shadow contributed zero
      transforms, even though the node does advertise a /tf endpoint while
      running), zero legacy-versus-shadow deltas over 620 time-paired samples
      without any retuning, and 2.3 % of one core with 22.9 MiB RSS against the
      equivalent legacy estimator at 2.9 % and 26.3 MiB. Shutdown was clean in
      about 9 s with no orphans, no movement and the legacy deployment
      untouched. This hardware validation covers a stationary shadow estimate
      only: it does not claim motion parity, calibration, global localization or
      any transferred authority, and the broad localization component stays
      ported. Observed and deferred without acting on them: the legacy
      /odometry/local rate varying from 19.3 Hz to about 10.3 Hz (also seen
      after Salus was removed, so not a shadow regression), the shadow tracking
      its 10 Hz inputs instead of the nominal 30 Hz, and the known double
      rclpy.shutdown exit-code-1 noise from #158.
  lidar_perception:
    source: navegacion_gps
    target: salus_perception
    state: ported
    evidence:
      - src/salus_perception/launch/lidar_sim.launch.py
      - src/salus_perception/test/test_scan_filters.py
      - tools/replay_lidar_report.py
      - tools/smoke_lidar_sim.py
    note: Reduced 8-channel Gazebo model and 3D local pipeline are ported. The raw Gazebo frame is normalized at /scan_3d; RS16 bag replay and RViz inspection are required for parity.
  rs16_real_owner:
    source: ROS2_SALUS@f35834989b041f51dd325c626d2338e2232d9e53 RS16 deployment
    target: salus_hardware/rslidar_sdk raw owner
    state: ported
    contracts:
      - rslidar_msg/RslidarPacket
      - sensor_msgs/PointCloud2
    evidence:
      - dependencies.repos
      - src/salus_hardware/config/rs16.yaml
      - src/salus_hardware/launch/rs16_real.launch.py
      - src/salus_hardware/test/test_rs16_real_launch.py
      - docs/migration-evidence/intent/rs16-real-owner-contract-2026-09-03.md
    note: >-
      The RoboSense SDK, message package and SDK-pinned rs_driver are imported
      at exact commits and build in the workspace. The raw-only launch has one
      SDK node, preserves /scan_3d and lidar_link, and freezes the observed
      base_link-to-lidar_link mount. This cut deliberately performs no physical
      RS16 launch or packet validation; perception /scan_clean remains a later
      cut and hardware_validated is not claimed.
  navigation:
    source: navegacion_gps
    target: salus_navigation
    state: ported
    evidence:
      - src/salus_navigation/salus_navigation/nav_command_server.py
      - src/salus_navigation/launch/safety_arbitration_sim.launch.py
      - tools/smoke_safety_sim.py
      - tools/smoke_patrol_battery_sim.py
      - docs/decisions/0003-latched-battery-return-home.md
      - src/salus_navigation/salus_navigation/nav_snapshot_server.py
      - tools/smoke_navigation_snapshot.sh
      - docs/migration-evidence/intent/rviz-goal-control.md
      - docs/migration-evidence/intent/2026-08-30-vector-keepout-costmap-layer.md
    note: >-
