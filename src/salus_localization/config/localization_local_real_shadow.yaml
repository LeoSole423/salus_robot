# Physical local EKF running in SHADOW next to the legacy estimator.
#
# Scope: estimate the local odometry frame only, for comparison. This file is
# intentionally separate from ``localization_local_sim.yaml``: the simulated
# profile owns ``odom -> base_footprint`` while this one must never do so.
#
# Inputs are the already-operational legacy wheel odometry and the logical
# ``/salus/imu/data`` produced by the read-only Salus observation profile.
# Canonical physical odometry is deliberately not used yet because the
# mechanical calibration of traction and steering is still pending.
#
# ``publish_tf``, ``use_control`` and ``publish_acceleration`` are also pinned
# again as explicit launch overrides: ``robot_localization`` defaults to
# publishing TF, so the safety must not depend on this file alone.
salus_local_ekf_shadow:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true

    transform_time_offset: 0.0
    transform_timeout: 0.0

    print_diagnostics: true

    publish_tf: false
    publish_acceleration: false
    use_control: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /wheel/odometry
    odom0_config: [true, true, false, false, false, true, true, true, false, false, false, true, false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    imu0: /salus/imu/data
    imu0_config: [false, false, false, false, false, false, false, false, false, false, false, true, false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
