# Authoritative local EKF profile for the compatible physical odometry MVP.
#
# The profile consumes the measured wheel odometry generated from
# ``DriveTelemetry`` and the logical physical IMU.  It is local-only:
# ``world_frame`` and ``odom_frame`` are both ``odom`` and this EKF is the
# sole owner of ``odom -> base_footprint`` in its launch composition.
salus_local_ekf:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true

    transform_time_offset: 0.0
    transform_timeout: 0.0

    print_diagnostics: true

    publish_tf: true
    publish_acceleration: false
    use_control: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /wheel/odometry
    odom0_config: [true, true, false, false, false, true, true, true, false, false, false, true, false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    imu0: /salus/imu/data
    imu0_config: [false, false, false, false, false, false, false, false, false, false, false, true, false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
