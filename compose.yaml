services:
  ros2:
    build:
      context: .
      args:
        USER_UID: ${SALUS_UID:-1000}
        USER_GID: ${SALUS_GID:-1000}
    image: salus-robot:humble-dev
    container_name: salus_robot_dev
    network_mode: host
    volumes:
      - .:/ros2_ws
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY:-}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
