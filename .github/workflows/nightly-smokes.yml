name: Nightly smoke reliability

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

jobs:
  reliability:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Match container user to runner workspace
        run: |
          echo "SALUS_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "SALUS_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build development image with BuildKit cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: salus-robot:humble-dev
          build-args: |
            USER_UID=${{ env.SALUS_UID }}
            USER_GID=${{ env.SALUS_GID }}
          cache-from: type=gha,scope=salus-humble
          cache-to: type=gha,mode=max,scope=salus-humble
      - name: Repeat isolated smoke scenarios three times
        run: |
          ./tools/build.sh
          ./tools/smoke_reliability.sh
      - name: Upload reliability diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-smoke-artifacts
          path: artifacts/smokes
          if-no-files-found: warn
          retention-days: 30
