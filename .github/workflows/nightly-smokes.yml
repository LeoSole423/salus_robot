name: Nightly smoke reliability

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      repetitions:
        description: Override repetitions for every nightly scenario
        required: false
        default: ""

env:
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Build nightly matrix from registry
        id: matrix
        run: echo "matrix=$(python3 tools/smoke_registry.py --nightly-matrix)" >> "$GITHUB_OUTPUT"

  reliability:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: nightly / ${{ matrix.id }}
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Match container user to runner workspace
        run: |
          echo "SALUS_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "SALUS_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build development image with BuildKit cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: salus-robot:humble-dev
          build-args: |
            USER_UID=${{ env.SALUS_UID }}
            USER_GID=${{ env.SALUS_GID }}
          cache-from: type=gha,scope=salus-humble
          cache-to: type=gha,mode=max,scope=salus-humble
      - name: Build workspace
        run: ./tools/build.sh
      - name: Repeat one registered smoke scenario
        env:
          SMOKE_SCENARIO_ID: ${{ matrix.id }}
          SMOKE_REPETITIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.repetitions != '' && inputs.repetitions || matrix.repetitions }}
        run: bash tools/smoke_reliability.sh
      - name: Upload reliability diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.id }}-artifacts
          path: artifacts/smokes
          if-no-files-found: warn
          retention-days: 30
