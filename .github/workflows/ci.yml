name: ROS 2 Humble CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        run: python3 tools/validate_repository.py
      - name: Match container user to runner workspace
        run: |
          echo "SALUS_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "SALUS_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build development image
        run: docker compose build
      - name: Build and test workspace
        run: ./tools/test.sh
      - name: Smoke-test migrated control slice
        run: ./tools/smoke_control_sim.sh
      - name: Smoke-test simulated vehicle motion
        run: ./tools/smoke_motion_sim.sh
      - name: Smoke-test local simulated localization
        run: ./tools/smoke_localization_sim.sh
      - name: Smoke-test integrated simulation checkpoint
        run: ./tools/smoke_integration_sim.sh
      - name: Smoke-test safety arbitration simulation
        run: ./tools/smoke_safety_sim.sh
      - name: Smoke-test autonomous navigation core simulation
        run: ./tools/smoke_navigation_core_sim.sh
      - name: Smoke-test dynamic keepout zones simulation
        run: ./tools/smoke_navigation_zones_sim.sh
