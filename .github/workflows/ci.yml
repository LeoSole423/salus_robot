name: ROS 2 Humble CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: salus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

jobs:
  classify-changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      classification: ${{ steps.scope.outputs.classification }}
      full_ci: ${{ steps.scope.outputs.full_ci }}
      run_simulation_core: ${{ steps.scope.outputs.run_simulation_core }}
      run_navigation_missions: ${{ steps.scope.outputs.run_navigation_missions }}
      run_smokes: ${{ steps.scope.outputs.run_smokes }}
      smoke_matrix: ${{ steps.scope.outputs.smoke_matrix }}
      smoke_control: ${{ steps.scope.outputs.smoke_control }}
      smoke_motion: ${{ steps.scope.outputs.smoke_motion }}
      smoke_localization: ${{ steps.scope.outputs.smoke_localization }}
      smoke_localization_canonical: ${{ steps.scope.outputs.smoke_localization_canonical }}
      smoke_sensor_selection: ${{ steps.scope.outputs.smoke_sensor_selection }}
      smoke_lidar: ${{ steps.scope.outputs.smoke_lidar }}
      smoke_safety: ${{ steps.scope.outputs.smoke_safety }}
      smoke_integration: ${{ steps.scope.outputs.smoke_integration }}
      smoke_navigation: ${{ steps.scope.outputs.smoke_navigation }}
      smoke_navigation_canonical: ${{ steps.scope.outputs.smoke_navigation_canonical }}
      smoke_navigation_no_obstacles: ${{ steps.scope.outputs.smoke_navigation_no_obstacles }}
      smoke_zones: ${{ steps.scope.outputs.smoke_zones }}
      smoke_routes: ${{ steps.scope.outputs.smoke_routes }}
      smoke_patrol_battery: ${{ steps.scope.outputs.smoke_patrol_battery }}
      smoke_snapshot: ${{ steps.scope.outputs.smoke_snapshot }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test change classifier
        run: python3 -m unittest tools/test_ci_smoke_selection.py tools/test_smoke_registry.py
      - name: Classify changed boundaries
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="${RUNNER_TEMP}/salus-ci-changed-files.txt"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only --no-renames --diff-filter=ACDMRT "${BASE_SHA}...${HEAD_SHA}" > "${changed_files}"
            python3 tools/ci_select_smokes.py --files "${changed_files}"
          else
            : > "${changed_files}"
            python3 tools/ci_select_smokes.py \
              --files "${changed_files}" \
              --full-reason "event ${EVENT_NAME} requires the complete CI suite"
          fi

  build-unit:
    needs: classify-changes
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Match container user to runner workspace
        run: |
          echo "SALUS_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "SALUS_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build development image with BuildKit cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: salus-robot:humble-dev
          build-args: |
            USER_UID=${{ env.SALUS_UID }}
            USER_GID=${{ env.SALUS_GID }}
          cache-from: type=gha,scope=salus-humble
          cache-to: type=gha,mode=max,scope=salus-humble
      - name: Import pinned RS16 sources and SDK submodule
        run: ./tools/import_dependencies.sh
      - name: Validate, build, lint and run unit tests
        run: ./tools/test.sh

  smoke:
    name: smoke / ${{ matrix.id }}
    needs: classify-changes
    if: needs.classify-changes.outputs.run_smokes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify-changes.outputs.smoke_matrix) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Match container user to runner workspace
        run: |
          echo "SALUS_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "SALUS_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Restore cached development image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: salus-robot:humble-dev
          build-args: |
            USER_UID=${{ env.SALUS_UID }}
            USER_GID=${{ env.SALUS_GID }}
          cache-from: type=gha,scope=salus-humble
      - name: Import pinned RS16 sources and SDK submodule
        run: ./tools/import_dependencies.sh
      - name: Build workspace for this runner
        run: ./tools/build.sh
      - name: Run registered smoke
        run: python3 tools/run_registered_smoke.py "${{ matrix.id }}" --context ci
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.id }}-artifacts
          path: artifacts/smokes
          if-no-files-found: warn
          retention-days: 7
