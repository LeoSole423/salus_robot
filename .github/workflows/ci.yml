name: ROS 2 Humble CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: salus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

jobs:
  build-unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Match container user to runner workspace
        run: |
          echo "SALUS_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "SALUS_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build development image with BuildKit cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: salus-robot:humble-dev
          build-args: |
            USER_UID=${{ env.SALUS_UID }}
            USER_GID=${{ env.SALUS_GID }}
          cache-from: type=gha,scope=salus-humble
          cache-to: type=gha,mode=max,scope=salus-humble
      - name: Validate, build, lint and run unit tests
        run: ./tools/test.sh

  simulation-core:
    needs: build-unit
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      SMOKE_HARD_TIMEOUT_S: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Match container user to runner workspace
        run: |
          echo "SALUS_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "SALUS_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Restore cached development image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: salus-robot:humble-dev
          build-args: |
            USER_UID=${{ env.SALUS_UID }}
            USER_GID=${{ env.SALUS_GID }}
          cache-from: type=gha,scope=salus-humble
      - name: Build workspace for this runner
        id: workspace
        run: ./tools/build.sh
      - name: Smoke — control and battery
        id: smoke_control
        if: always() && steps.workspace.outcome == 'success'
        continue-on-error: true
        run: ./tools/run_smoke.sh ./tools/smoke_control_sim.sh
      - name: Smoke — simulated movement
        id: smoke_motion
        if: always() && steps.workspace.outcome == 'success'
        continue-on-error: true
        run: ./tools/run_smoke.sh ./tools/smoke_motion_sim.sh
      - name: Smoke — local localization
        id: smoke_localization
        if: always() && steps.workspace.outcome == 'success'
        continue-on-error: true
        run: ./tools/run_smoke.sh ./tools/smoke_localization_sim.sh
      - name: Smoke — LiDAR perception
        id: smoke_lidar
        if: always() && steps.workspace.outcome == 'success'
        continue-on-error: true
        run: ./tools/run_smoke.sh ./tools/smoke_lidar_sim.sh
      - name: Smoke — safety arbitration
        id: smoke_safety
        if: always() && steps.workspace.outcome == 'success'
        continue-on-error: true
        run: ./tools/run_smoke.sh ./tools/smoke_safety_sim.sh
      - name: Smoke — integrated structure
        id: smoke_integration
        if: always() && steps.workspace.outcome == 'success'
        continue-on-error: true
        run: ./tools/run_smoke.sh ./tools/smoke_integration_sim.sh
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-core-smoke-artifacts
          path: artifacts/smokes
          if-no-files-found: warn
          retention-days: 7
      - name: Aggregate core smoke results
        if: always()
        env:
          WORKSPACE: ${{ steps.workspace.outcome }}
          CONTROL: ${{ steps.smoke_control.outcome }}
          MOTION: ${{ steps.smoke_motion.outcome }}
          LOCALIZATION: ${{ steps.smoke_localization.outcome }}
          LIDAR: ${{ steps.smoke_lidar.outcome }}
          SAFETY: ${{ steps.smoke_safety.outcome }}
          INTEGRATION: ${{ steps.smoke_integration.outcome }}
        run: ./tools/aggregate_smoke_results.sh WORKSPACE CONTROL MOTION LOCALIZATION LIDAR SAFETY INTEGRATION

  navigation-missions:
    needs: build-unit
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      SMOKE_HARD_TIMEOUT_S: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Match container user to runner workspace
        run: |
          echo "SALUS_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "SALUS_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Restore cached development image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: salus-robot:humble-dev
          build-args: |
            USER_UID=${{ env.SALUS_UID }}
            USER_GID=${{ env.SALUS_GID }}
          cache-from: type=gha,scope=salus-humble
      - name: Build workspace for this runner
        id: workspace
        run: ./tools/build.sh
      - name: Smoke — navigation core
        id: smoke_navigation
        if: always() && steps.workspace.outcome == 'success'
        continue-on-error: true
        run: ./tools/run_smoke.sh ./tools/smoke_navigation_core_sim.sh
      - name: Smoke — navigation zones
        id: smoke_zones
        if: always() && steps.workspace.outcome == 'success'
        continue-on-error: true
        run: ./tools/run_smoke.sh ./tools/smoke_navigation_zones_sim.sh
      - name: Smoke — route executor
        id: smoke_routes
        if: always() && steps.workspace.outcome == 'success'
        continue-on-error: true
        run: ./tools/run_smoke.sh ./tools/smoke_route_executor_sim.sh
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-missions-smoke-artifacts
          path: artifacts/smokes
          if-no-files-found: warn
          retention-days: 7
      - name: Aggregate navigation smoke results
        if: always()
        env:
          WORKSPACE: ${{ steps.workspace.outcome }}
          NAVIGATION: ${{ steps.smoke_navigation.outcome }}
          ZONES: ${{ steps.smoke_zones.outcome }}
          ROUTES: ${{ steps.smoke_routes.outcome }}
        run: ./tools/aggregate_smoke_results.sh WORKSPACE NAVIGATION ZONES ROUTES
